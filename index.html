<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUNTER SYSTEM</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --accent-color: #ff3e3e;
            --accent-hover: #e03232;
            --text-main: #f1f1f1;
            --text-muted: #8a8d93;
            --border-color: #2a2e39;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent-color);
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        .msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .msg.error {
            background-color: rgba(255, 62, 62, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            display: block;
        }

        .msg.success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-card .val {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-card .lbl {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }

        .task-list {
            margin-top: 20px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85rem;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>HUNTER SYSTEM</h1>
            <p id="subHeader">نظام تتبع التطور واللياقة البدنية</p>
        </div>

        <!-- AUTH SECTION -->
        <div id="authSection">
            <div class="form-group" id="usernameGroup">
                <label>اسم الصياد (اسم المستخدم)</label>
                <input type="text" id="username" placeholder="مثال: SungJinWoo">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="hunter@domain.com">
            </div>

            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn" id="btnLogin">تسجيل الدخول</button>
            <button class="btn btn-secondary" id="btnRegister">إنشاء حساب جديد</button>
            <button class="link-btn" id="forgotPassword">نسيت كلمة السر؟</button>

            <div id="authMsg" class="msg"></div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="val" id="userLevel">1</div>
                    <div class="lbl">المستوى (Level)</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="userXP">0</div>
                    <div class="lbl">نقاط الخبرة (XP)</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="journeyDay">1</div>
                    <div class="lbl">اليوم الحالي</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="streakDays">0</div>
                    <div class="lbl">أيام الالتزام المتتالية</div>
                </div>
            </div>

            <div class="task-list">
                <h3>مهام اليوم الرياضية</h3>
                <br>
                <div class="form-group">
                    <label>تمرين الضغط (Pushups)</label>
                    <input type="number" id="inputPushups" value="100">
                </div>
                <div class="form-group">
                    <label>تمرين القرفصاء (Squats)</label>
                    <input type="number" id="inputSquats" value="100">
                </div>
                <div class="form-group">
                    <label>تمرين المعدة (Abs)</label>
                    <input type="number" id="inputAbs" value="100">
                </div>

                <button class="btn" id="btnCompleteDay">إكمال المهمة اليومية</button>
                <button class="btn btn-secondary" id="btnLogout">تسجيل الخروج</button>
            </div>

            <div id="dashMsg" class="msg"></div>
        </div>
    </div>

    <script>
        /* المفاتيح الخاصة بـ SUPABASE */
        const SUPABASE_URL = "https://nwtkaffjdnlbbxgfluh.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53YmthZmZqZGZubGJseGdmZnVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzODY3NDgsImV4cCI6MjEwNTk2Mjc0OH0.Bl0_GpsbnXXB0sxo2aujyEwFYRNMpS_ZqjUkI7uhFBg";

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let activeJourney = null;

        /* HELPERS */
        function todayISO() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        function setAuthMessage(text, isSuccess = false) {
            const msgEl = document.getElementById("authMsg");
            msgEl.textContent = text;
            msgEl.className = isSuccess ? "msg success" : "msg error";
        }

        function setDashMessage(text, isSuccess = false) {
            const msgEl = document.getElementById("dashMsg");
            msgEl.textContent = text;
            msgEl.className = isSuccess ? "msg success" : "msg error";
        }

        function friendlyError(errorMsg) {
            if (errorMsg.includes("Invalid login credentials")) return "بيانات الدخول غير صحيحة.";
            if (errorMsg.includes("User already registered")) return "البريد الإلكتروني مُسجل بالفعل.";
            if (errorMsg.includes("Password should be at least")) return "كلمة السر يجب أن تكون 6 أحرف على الأقل.";
            return errorMsg;
        }

        /* AUTH LOGIC */
        async function handleRegister() {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!username || !email || !password) {
                setAuthMessage("يرجى ملء جميع الحقول.");
                return;
            }

            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { username } }
            });

            if (error) {
                setAuthMessage(friendlyError(error.message));
                return;
            }

            if (data.user) {
                // Create profile
                await supabase.from("profiles").insert([{ id: data.user.id, username }]);
                setAuthMessage("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.", true);
            }
        }

        async function handleLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                setAuthMessage("يرجى إدخال البريد وكلمة السر.");
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                setAuthMessage(friendlyError(error.message));
                return;
            }

            if (data.user) {
                currentUser = data.user;
                initDashboard();
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            currentUser = null;
            document.getElementById("authSection").classList.remove("hidden");
            document.getElementById("dashboardSection").classList.add("hidden");
            document.getElementById("subHeader").textContent = "نظام تتبع التطور واللياقة البدنية";
        }

        /* DASHBOARD & JOURNEY LOGIC */
        async function initDashboard() {
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");

            // Fetch Journey
            let { data: journeys } = await supabase
                .from("journeys")
                .select("*")
                .eq("user_id", currentUser.id)
                .is("actual_end_date", null)
                .limit(1);

            if (!journeys || journeys.length === 0) {
                // Create New Journey
                const today = todayISO();
                const endDate = new Date();
                endDate.setDate(endDate.getDate() + 30);
                const endDateStr = endDate.toISOString().split("T")[0];

                const { data: newJ, error } = await supabase.from("journeys").insert([{
                    user_id: currentUser.id,
                    start_date: today,
                    planned_end_date: endDateStr,
                    xp: 0,
                    level: 1
                }]).select();

                if (newJ) activeJourney = newJ[0];
            } else {
                activeJourney = journeys[0];
            }

            loadUserData();
        }

        async function loadUserData() {
            if (!activeJourney) return;

            document.getElementById("userLevel").textContent = activeJourney.level || 1;
            document.getElementById("userXP").textContent = activeJourney.xp || 0;

            // Get Daily Logs
            const { data: logs } = await supabase
                .from("daily_logs")
                .select("*")
                .eq("journey_id", activeJourney.id);

            const dayCount = logs ? logs.length + 1 : 1;
            document.getElementById("journeyDay").textContent = dayCount;
            document.getElementById("streakDays").textContent = logs ? logs.length : 0;
        }

        async function handleCompleteDay() {
            const pushups = parseInt(document.getElementById("inputPushups").value) || 0;
            const squats = parseInt(document.getElementById("inputSquats").value) || 0;
            const abs = parseInt(document.getElementById("inputAbs").value) || 0;

            const today = todayISO();

            // Check if log exists for today
            const { data: existing } = await supabase
                .from("daily_logs")
                .select("id")
                .eq("journey_id", activeJourney.id)
                .eq("log_date", today);

            if (existing && existing.length > 0) {
                setDashMessage("لقد أكملت مهمة اليوم بالفعل!");
                return;
            }

            const earnedXP = 100;
            const { error } = await supabase.from("daily_logs").insert([{
                journey_id: activeJourney.id,
                user_id: currentUser.id,
                journey_day: parseInt(document.getElementById("journeyDay").textContent),
                log_date: today,
                status: "completed",
                pushups,
                squats,
                abs,
                xp_earned: earnedXP
            }]);

            if (error) {
                setDashMessage("حدث خطأ أثناء حفظ البيانات.");
                return;
            }

            // Update Journey XP and Level
            const newXP = (activeJourney.xp || 0) + earnedXP;
            const newLevel = Math.floor(newXP / 500) + 1;

            await supabase
                .from("journeys")
                .update({ xp: newXP, level: newLevel })
                .eq("id", activeJourney.id);

            activeJourney.xp = newXP;
            activeJourney.level = newLevel;

            setDashMessage("عاش يا بطل! تم تسجيل المهمة واكتساب +100 XP", true);
            loadUserData();
        }

        /* EVENT LISTENERS */
        document.getElementById("btnRegister").addEventListener("click", handleRegister);
        document.getElementById("btnLogin").addEventListener("click", handleLogin);
        document.getElementById("btnLogout").addEventListener("click", handleLogout);
        document.getElementById("btnCompleteDay").addEventListener("click", handleCompleteDay);

        document.getElementById("forgotPassword").addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim();
            if (!email) {
                setAuthMessage("يرجى كتابة البريد الإلكتروني أولاً.");
                return;
            }
            const { error } = await supabase.auth.resetPasswordForEmail(email);
            if (error) setAuthMessage(friendlyError(error.message));
            else setAuthMessage("تم إرسال رابط إعادة ضبط كلمة السر إلى بريدك الإلكتروني.", true);
        });

        // Check active session on load
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                currentUser = session.user;
                initDashboard();
            }
        });
    </script>
</body>
</html>
